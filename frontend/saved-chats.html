<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mingling | Saved Conversations</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .saved-container {
      max-width: 900px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }
    .saved-card {
      padding: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon"><i class="fa-solid fa-fire-flame-curved"></i></div>
      <span>Mingling</span>
    </a>
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <button id="theme-toggle-btn" class="btn btn-glass btn-icon" title="Toggle Light / Dark Mode" style="width:38px; height:38px;">
        <i class="fa-solid fa-moon"></i>
      </button>
      <a href="room.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Rooms</a>
      <a href="settings.html" class="btn btn-glass btn-sm"><i class="fa-solid fa-gear"></i> Settings</a>
      <button class="btn btn-danger btn-sm btn-end-session" title="End Session & Purge Token"><i class="fa-solid fa-power-off"></i> End Session</button>
    </div>
  </nav>

  <div class="saved-container">
    <div style="margin-bottom:2rem;">
      <h1 class="hero-title" style="font-size:2.2rem; margin-bottom:0.5rem;">Your <span class="text-gradient">Saved Conversations</span></h1>
      <p class="text-muted">Explicitly saved chats remain stored securely in MongoDB Atlas until you delete them.</p>
    </div>

    <div id="saved-chats-list">
      <p class="text-muted" style="text-align:center;">Loading saved conversations...</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/saved-chats.js"></script>
</body>
</html>
