<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mingling | Room Manager</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .room-container {
      max-width: 1000px;
      margin: 6rem auto 4rem;
      padding: 0 1.5rem;
    }
    .room-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    .public-room-card {
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon"><i class="fa-solid fa-fire-flame-curved"></i></div>
      <span>Mingling</span>
    </a>
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <button id="theme-toggle-btn" class="btn btn-glass btn-icon" title="Toggle Light / Dark Mode" style="width:38px; height:38px;">
        <i class="fa-solid fa-moon"></i>
      </button>
      <div id="user-badge" class="glass-card" style="padding:0.4rem 0.85rem; display:flex; align-items:center; gap:0.5rem; font-size:0.85rem;">
        <span id="user-avatar" style="width:24px; height:24px; display:inline-block;"></span>
        <span id="user-nickname" style="font-weight:700;">Anonymous</span>
      </div>
      <a href="saved-chats.html" class="btn btn-glass btn-sm"><i class="fa-solid fa-bookmark"></i> Saved</a>
      <a href="settings.html" class="btn btn-glass btn-sm"><i class="fa-solid fa-gear"></i> Settings</a>
      <button class="btn btn-danger btn-sm btn-end-session" title="End Session & Purge Token"><i class="fa-solid fa-power-off"></i> End Session</button>
    </div>
  </nav>

  <div class="room-container">
    <div style="text-align:center; margin-bottom:2.5rem;">
      <h1 class="hero-title" style="font-size:2.5rem; margin-bottom:0.5rem;">Start or Join a <span class="text-gradient">Mingling Room</span></h1>
      <p class="text-muted">No registration. Temporary conversations automatically self-destruct when expired.</p>
    </div>

    <div class="room-grid">
      <!-- Create Room Box -->
      <div class="glass-card" style="padding:2rem;">
        <h2 style="margin-bottom:1.25rem; display:flex; align-items:center; gap:0.6rem;"><i class="fa-solid fa-plus-circle text-gradient"></i> Create a New Room</h2>
        <form id="create-room-form" style="display:flex; flex-direction:column; gap:1.25rem;">
          <div class="input-group">
            <label class="input-label">Room Name</label>
            <input type="text" id="create-name" class="input-field" placeholder="e.g. Design Sprint or Game Squad" required>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="input-group">
              <label class="input-label">Room Privacy</label>
              <select id="create-privacy" class="input-field">
                <option value="public">Public Room</option>
                <option value="private">Private (Password Locked)</option>
              </select>
            </div>

            <div class="input-group">
              <label class="input-label">Expiration Timer</label>
              <select id="create-expiration" class="input-field">
                <option value="1">1 Hour</option>
                <option value="6">6 Hours</option>
                <option value="24" selected>24 Hours</option>
                <option value="72">3 Days</option>
              </select>
            </div>
          </div>

          <div id="password-wrapper" class="input-group" style="display:none;">
            <label class="input-label">Room Password</label>
            <input type="password" id="create-password" class="input-field" placeholder="Set room password">
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;"><i class="fa-solid fa-rocket"></i> Create Room</button>
        </form>
      </div>

      <!-- Join Room Box -->
      <div class="glass-card" style="padding:2rem;">
        <h2 style="margin-bottom:1.25rem; display:flex; align-items:center; gap:0.6rem;"><i class="fa-solid fa-right-to-bracket text-gradient"></i> Join Existing Room</h2>
        <form id="join-room-form" style="display:flex; flex-direction:column; gap:1.25rem;">
          <div class="input-group">
            <label class="input-label">Room ID or Code</label>
            <input type="text" id="join-code" class="input-field" placeholder="e.g. MNGL-8921 or room_id" required>
          </div>

          <div class="input-group">
            <label class="input-label">Password (If Private)</label>
            <input type="password" id="join-password" class="input-field" placeholder="Optional room password">
          </div>

          <button type="submit" class="btn btn-secondary" style="margin-top:0.5rem;"><i class="fa-solid fa-arrow-right"></i> Join Room</button>
        </form>

        <hr style="border:none; border-top:1px solid var(--border-glass); margin:2rem 0 1.5rem;">

        <!-- Active Public Rooms List -->
        <h3 style="font-size:1.1rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center;">
          <span>Public Rooms</span>
          <button id="refresh-public-rooms" class="btn btn-glass btn-sm" style="padding:0.2rem 0.5rem;"><i class="fa-solid fa-rotate"></i></button>
        </h3>
        <div id="public-rooms-list" style="max-height:220px; overflow-y:auto;">
          <p class="text-muted" style="font-size:0.85rem; text-align:center;">Loading public rooms...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/rooms.js"></script>
</body>
</html>
